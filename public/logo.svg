<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Frame persegi dengan sudut membulat -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Frame persegi -->
  <rect x="2" y="2" width="96" height="96" rx="16" ry="16"
        fill="url(#bgGrad)" stroke="#10B981" stroke-width="3" />

  <!-- Bulan sabit -->
  <path d="M 68 22 
           A 30 30 0 1 0 68 78 
           A 24 24 0 1 1 68 22 Z"
        fill="url(#moonGrad)" />

  <!-- Bintang 5 sudut -->
  <polygon points="76,28 78,33 83,33 79,36 81,41 76,38 71,41 73,36 69,33 74,33"
           fill="#10B981" />

  <!-- Bintang kecil kedua -->
  <polygon points="32,26 33.2,29 36,29 33.8,30.8 34.6,33.5 32,31.8 29.4,33.5 30.2,30.8 28,29 30.8,29"
           fill="#10B981" opacity="0.7" />
</svg>